[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# pytest.ini — ExpandTesting Notes App Automation Framework
# ─────────────────────────────────────────────────────────────────────────────

# Test discovery
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Allure report output directory
addopts =
    --alluredir=reports/allure-results
    --clean-alluredir
    -v
    --tb=short
    --strict-markers
    --timeout=60

# ── Parallel execution (pytest-xdist) ─────────────────────────────────────────
# Uncomment below to enable parallel by default:
# addopts = -n auto --alluredir=reports/allure-results -v --tb=short

# ── Retry flaky tests ─────────────────────────────────────────────────────────
# Requires pytest-rerunfailures
# addopts = --reruns 2 --reruns-delay 1

# Timeout for each test (seconds)
timeout = 120

# Custom markers (prevents PytestUnknownMarkWarning)
markers =
    empty: marks tests for empty title validation
    ui: marks UI-only tests
    api: marks API-only tests
    e2e: marks end-to-end hybrid tests
    smoke: marks smoke/sanity tests (subset for quick validation)
    regression: marks full regression tests
    negative: marks negative/error-path tests
    performance: marks performance-checking tests
    flaky: marks tests known to be occasionally flaky (candidates for retry)

# Log format for pytest live logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] %(name)s — %(message)s
log_cli_date_format = %H:%M:%S

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)-8s] %(name)s:%(lineno)d — %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
